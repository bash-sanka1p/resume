name: Build and Deploy Resume

on:
  push:
    branches:
      - main

permissions:
  contents: write   # Needed for pushing to gh-pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install minimal LaTeX
        run: sudo apt-get update && sudo apt-get install -y \
             texlive-latex-recommended texlive-latex-extra \
             texlive-fonts-recommended latexmk

      - name: Build PDF
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error resume.tex

      - name: Rename PDF to index.pdf
        run: mv resume.pdf index.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: index.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download built PDF
        uses: actions/download-artifact@v4
        with:
          name: resume
          path: .

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
