name: Build and Deploy Resume

on:
  push:
    branches:
      - main

# allow GH Actions to push to gh-pages
permissions:
  contents: write

jobs:
  build:
    # run the job inside a small TeX Live container (no apt-get)
    runs-on: ubuntu-latest
    container:
      image: danteev/texlive:latest
      # optional: set retry / pull policy
      options: --pull=always

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure public dir
        run: mkdir -p public

      - name: Build PDF with latexmk
        # the container already has latexmk/texlive; build resume.tex
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error resume.tex
          # ensure a consistent filename
          mv -f resume.pdf public/index.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: public/index.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for peaceiris action; not strictly required to have files)
        uses: actions/checkout@v4

      - name: Download built PDF
        uses: actions/download-artifact@v4
        with:
          name: resume
          path: public

      - name: Deploy only public/index.pdf to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
